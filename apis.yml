description: Census is a reverse ETL and data activation platform that syncs data from cloud data warehouses
  (Snowflake, BigQuery, Databricks, Redshift) into operational SaaS applications. Census was acquired
  by Fivetran and is now branded as Fivetran Activations, offering a REST API for managing workspaces,
  datasets, syncs, destinations, and custom destinations, plus embedded Activations (Connect Links) for
  Powered by Fivetran use cases.
