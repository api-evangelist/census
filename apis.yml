    type: GettingStarted
  - url: graphql/census-graphql.md
    type: GraphQL
  description: The Census Activations REST API (formerly Census Management API) lets teams programmatically
    manage reverse ETL pipelines, sources, models, destinations, syncs, and sync runs. The API is region-scoped
    and authenticated with personal access tokens, with organization-level resources (workspaces, users,
    invitations) and workspace-level resources (datasets, destinations, syncs).
